<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image → Base64 Converter</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 20px; color: #1f2937; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    label { font-weight: 600; font-size: 14px; }
    input[type="number"], input[type="text"], select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; min-width: 120px; }
    input[type="file"] { padding: 4px; }
    button { padding: 8px 12px; border: 1px solid #0ea5e9; background: #0ea5e9; color: white; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button.secondary { background: white; color: #0ea5e9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .outputs { display: grid; gap: 12px; margin-top: 16px; }
    textarea { width: 100%; min-height: 140px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 12px; }
    .hint { color: #64748b; font-size: 12px; }
    .preview { margin-top: 8px; display: flex; gap: 16px; align-items: center; }
    .preview canvas, .preview img { border: 1px solid #e5e7eb; border-radius: 6px; }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const fileInput = document.getElementById('file');
      const urlInput = document.getElementById('url');
      const widthInput = document.getElementById('width');
      const heightInput = document.getElementById('height');
      const mimeSelect = document.getElementById('mime');
      const qualityInput = document.getElementById('quality');
      const convertBtn = document.getElementById('convert');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const dataUrlText = document.getElementById('dataurl');
      const base64Text = document.getElementById('base64');
      const copyDataUrlBtn = document.getElementById('copyDataUrl');
      const copyBase64Btn = document.getElementById('copyBase64');
      const resultImg = document.getElementById('resultImg');

      function loadImageFromFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('Failed to read file'));
          reader.onload = () => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error('Failed to load image'));
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }

      function loadImageFromUrl(url) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('Failed to load image from URL (CORS?)'));
          img.src = url;
        });
      }

      async function getImage() {
        if (fileInput.files && fileInput.files[0]) {
          return loadImageFromFile(fileInput.files[0]);
        }
        const url = urlInput.value.trim();
        if (url) {
          return loadImageFromUrl(url);
        }
        throw new Error('Please choose a file or enter an image URL');
      }

      function drawContain(img, w, h, mime) {
        canvas.width = w; canvas.height = h;
        // Fill background for non-transparent formats
        if (mime === 'image/jpeg') {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
        } else {
          ctx.clearRect(0, 0, w, h);
        }
        const scale = Math.min(w / img.width, h / img.height);
        const dw = Math.round(img.width * scale);
        const dh = Math.round(img.height * scale);
        const dx = Math.floor((w - dw) / 2);
        const dy = Math.floor((h - dh) / 2);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, dx, dy, dw, dh);
      }

      async function convert() {
        try {
          convertBtn.disabled = true;
          const img = await getImage();
          const w = Math.max(1, parseInt(widthInput.value || '256', 10));
          const h = Math.max(1, parseInt(heightInput.value || '256', 10));
          const mime = mimeSelect.value;
          const q = parseFloat(qualityInput.value || '0.92');
          drawContain(img, w, h, mime);
          const dataUrl = canvas.toDataURL(mime, isFinite(q) ? q : undefined);
          const base64 = dataUrl.split(',')[1] || '';
          dataUrlText.value = dataUrl;
          base64Text.value = base64;
          resultImg.src = dataUrl;
        } catch (err) {
          alert(err.message);
        } finally {
          convertBtn.disabled = false;
        }
      }

      function copyToClipboard(el) {
        el.select();
        el.setSelectionRange(0, el.value.length);
        document.execCommand('copy');
      }

      convertBtn.addEventListener('click', convert);
      copyDataUrlBtn.addEventListener('click', () => copyToClipboard(dataUrlText));
      copyBase64Btn.addEventListener('click', () => copyToClipboard(base64Text));
    });
  </script>
  </head>
  <body>
    <h1>Image → Base64 Converter</h1>
    <div class="row">
      <label for="file">Local file:</label>
      <input id="file" type="file" accept="image/*" />
    </div>
    <div class="row">
      <label for="url">or Image URL:</label>
      <input id="url" type="text" placeholder="https://example.com/image.png" style="min-width: 320px;" />
      <span class="hint">Note: Remote URLs may require CORS.</span>
    </div>
    <div class="row">
      <label for="width">Width:</label>
      <input id="width" type="number" value="256" min="1" />
      <label for="height">Height:</label>
      <input id="height" type="number" value="256" min="1" />
      <label for="mime">Format:</label>
      <select id="mime">
        <option value="image/png" selected>PNG</option>
        <option value="image/jpeg">JPEG</option>
        <option value="image/webp">WebP</option>
      </select>
      <label for="quality">Quality (JPEG/WebP):</label>
      <input id="quality" type="number" step="0.01" min="0" max="1" value="0.92" />
      <button id="convert">Convert</button>
    </div>

    <div class="preview">
      <canvas id="canvas" width="256" height="256" hidden></canvas>
      <div>
        <div class="hint">Preview:</div>
        <img id="resultImg" alt="Result preview" style="max-width: 256px; max-height: 256px;" />
      </div>
    </div>

    <div class="outputs">
      <div>
        <div class="row" style="justify-content: space-between;">
          <label>Data URL</label>
          <button id="copyDataUrl" class="secondary" type="button">Copy</button>
        </div>
        <textarea id="dataurl" readonly></textarea>
      </div>

      <div>
        <div class="row" style="justify-content: space-between;">
          <label>Base64 only</label>
          <button id="copyBase64" class="secondary" type="button">Copy</button>
        </div>
        <textarea id="base64" readonly></textarea>
      </div>
    </div>
  </body>
</html>
