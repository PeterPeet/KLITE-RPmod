<svg viewBox="0 0 740 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8a8a8a"/></marker>
  </defs>
  <text x="20" y="30" fill="#8a8a8a" font-size="15" font-weight="600">How an in-chat command changes the world</text>

  <rect x="20" y="52" width="210" height="70" rx="10" fill="#7F77DD"/>
  <text x="34" y="78" fill="#fff" font-size="13" font-weight="600">1 · AI writes a tag</text>
  <text x="34" y="98" fill="#ffffffe6" font-size="12" font-family="ui-monospace,monospace">…you head out.</text>
  <text x="34" y="114" fill="#fff" font-size="12" font-family="ui-monospace,monospace">&lt;move&gt;Forest Road&lt;/move&gt;</text>

  <rect x="270" y="52" width="200" height="70" rx="10" fill="#BA7517"/>
  <text x="284" y="78" fill="#fff" font-size="13" font-weight="600">2 · Engine parses it</text>
  <text x="284" y="98" fill="#ffffffe6" font-size="11.5">on your next message,</text>
  <text x="284" y="114" fill="#ffffffe6" font-size="11.5">runtime state updates</text>

  <rect x="510" y="52" width="210" height="70" rx="10" fill="#1D9E75"/>
  <text x="524" y="78" fill="#fff" font-size="13" font-weight="600">3 · New slice built</text>
  <text x="524" y="98" fill="#ffffffe6" font-size="11.5">now at Forest Road:</text>
  <text x="524" y="114" fill="#ffffffe6" font-size="11.5">its NPCs, objects, lore</text>

  <line x1="230" y1="87" x2="268" y2="87" stroke="#8a8a8a" stroke-width="1.7" marker-end="url(#a2)"/>
  <line x1="470" y1="87" x2="508" y2="87" stroke="#8a8a8a" stroke-width="1.7" marker-end="url(#a2)"/>

  <path d="M615,122 C615,165 380,165 250,165 L125,165" fill="none" stroke="#8a8a8a" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a2)"/>
  <text x="300" y="158" fill="#8a8a8a" font-size="11.5" text-anchor="middle">the AI's next reply is written from the new location</text>

  <text x="20" y="210" fill="#8a8a8a" font-size="13" font-weight="600">Categories</text>
  <g font-size="11.5">
    <rect x="20"  y="222" width="12" height="12" rx="3" fill="#1D9E75"/><text x="40"  y="232" fill="#8a8a8a">movement &lt;move&gt; &lt;npcmove&gt;</text>
    <rect x="250" y="222" width="12" height="12" rx="3" fill="#7F77DD"/><text x="270" y="232" fill="#8a8a8a">characters &lt;mood&gt;</text>
    <rect x="470" y="222" width="12" height="12" rx="3" fill="#BA7517"/><text x="490" y="232" fill="#8a8a8a">state &lt;flag&gt; &lt;quest&gt; items</text>
    <rect x="20"  y="248" width="12" height="12" rx="3" fill="#378ADD"/><text x="40"  y="258" fill="#8a8a8a">time &lt;time&gt; &lt;weather&gt; &lt;advance&gt;</text>
    <rect x="250" y="248" width="12" height="12" rx="3" fill="#D85A30"/><text x="270" y="258" fill="#8a8a8a">inventory &lt;give&gt; &lt;take&gt;</text>
  </g>
  <text x="20" y="298" fill="#8a8a8a" font-size="11.5">Tip: you can type these yourself too — e.g. send  &lt;move&gt;Tavern&lt;/move&gt;  to relocate.</text>
</svg>
